name: Buat Installer Windows

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Ambil Kode
        uses: actions/checkout@v4

      - name: Siapkan Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Pasang Bahan dan Build Web
        run: |
          npm install --legacy-peer-deps
          npx vite build --base=./

      - name: Siapkan Jendela Aplikasi Desktop
        run: |
          @'
          const { app, BrowserWindow } = require('electron');
          const path = require('path');
          app.whenReady().then(() => {
            const win = new BrowserWindow({ width: 1200, height: 800 });
            win.setMenuBarVisibility(false);
            win.loadFile(path.join(__dirname, 'dist', 'index.html'));
          });
          app.on('window-all-closed', () => app.quit());
          '@ | Set-Content -Path electron-main.cjs -Encoding UTF8
          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('package.json'));p.main='electron-main.cjs';fs.writeFileSync('package.json',JSON.stringify(p,null,2));"

      - name: Bungkus Jadi EXE
        run: |
          npx electron-packager . AplikasiAI --platform=win32 --arch=x64 --out=hasil-app --overwrite
          Compress-Archive -Path hasil-app\AplikasiAI-win32-x64\* -DestinationPath AplikasiAI-Windows.zip

      - name: Simpan Hasil Download
        uses: actions/upload-artifact@v4
        with:
          name: Aplikasi-Windows-Siap-Pakai
          path: AplikasiAI-Windows.zip
